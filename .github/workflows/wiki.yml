name: Wiki

# Überträgt den Ordner "wiki/" bei jedem Push auf "main" ins GitHub-Wiki des Repos.
# Einmalig nötig: unter Settings → Features "Wikis" aktivieren und im Reiter "Wiki"
# die erste Seite anlegen (Inhalt egal, wird danach überschrieben).

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Wiki übertragen
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name || github.actor }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email || format('{0}@users.noreply.github.com', github.actor) }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
          # Wiki-Inhalt komplett durch den Ordner "wiki/" ersetzen (außer .git)
          find wiki-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r wiki/. wiki-repo/
          cd wiki-repo
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki ist schon aktuell."
            exit 0
          fi
          git commit -m "Wiki aktualisiert (${GITHUB_SHA::7})"
          git push
