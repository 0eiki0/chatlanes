name: Build

# Baut die Mod bei jedem Push und Pull Request.
# Die fertige .jar liegt danach unter "Actions" → Lauf auswählen → "Artifacts".
# Wird ein Tag wie "v1.0.2" gepusht, entsteht zusätzlich automatisch ein GitHub-Release mit der .jar.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Mod bauen
        run: ./gradlew build --no-daemon

      - name: Jar bereitstellen
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          rm -f dist/*-sources.jar

      - name: Jar als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: chattabs
          path: dist/*.jar
          if-no-files-found: error

      - name: Release erstellen (nur bei Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
