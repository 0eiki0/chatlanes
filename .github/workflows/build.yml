name: Build

# Baut die Mod bei jedem Push und Pull Request.
# - Die fertige .jar liegt danach unter "Actions" → Lauf auswählen → "Artifacts".
# - Bei jedem Push auf "main" wird zusätzlich automatisch ein GitHub-Release mit der .jar erstellt:
#     * neue Version in gradle.properties (z. B. 1.6.0)  → Release "v1.6.0"
#     * Version unverändert (Tag gibt es schon)          → Release "v1.6.0-build.<Nummer>"

on:
  push:
    branches: ["**"]
    # Reine Wiki-Änderungen brauchen keinen Build und kein neues Release
    paths-ignore:
      - "wiki/**"
      - ".github/workflows/wiki.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Tags werden gebraucht, um zu prüfen, ob die Version schon veröffentlicht ist

      - name: Java 25 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v6

      - name: Mod bauen
        run: ./gradlew build --no-daemon

      - name: Jar bereitstellen
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          rm -f dist/*-sources.jar

      - name: Jar als Artifact hochladen
        uses: actions/upload-artifact@v7
        with:
          name: chatlanes
          path: dist/*.jar
          if-no-files-found: error

      - name: Release-Namen bestimmen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          tag="v${version}"
          title="ChatLanes ${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            # Version schon veröffentlicht → Build-Nummer anhängen, nichts überschreiben
            tag="v${version}-build.${GITHUB_RUN_NUMBER}"
            title="ChatLanes ${version} (Build ${GITHUB_RUN_NUMBER})"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=${title}" >> "$GITHUB_OUTPUT"
          # Commit-Nachricht als Beschreibung des Releases (ohne die Co-Author-Zeilen)
          git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > release-notes.md

      - name: Release erstellen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.title }}
          body_path: release-notes.md
          files: dist/*.jar
          make_latest: true
